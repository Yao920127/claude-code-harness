# CCH (Claude Code Harness) defaults, layered after dsh-base and dsh-web-app.
# New Sessions start on the Claude Code model route, which signs in with the
# host's own Claude Code login, and the DeepSeek model routes, account settings
# card, and official DeepSeek brand occupants stay unmounted. A person's own settings, saved to
# the profile patch, still override these rows.

- id: agent-default-model
  config:
    provider: claude-code
    model: default

# The interface starts in Traditional Chinese; a language chosen in Settings overrides it.
- id: locale
  config:
    preference: zh-TW

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: ui-brand-official
  disabled: true

# CCH signs in only through Claude Code, so the DeepSeek account settings card is not offered.
- id: ui-settings-account
  disabled: true

# CCH sends nothing to DeepSeek services: session and message feedback, the
# OTel exporter that releases a feedback-marked Session log to DeepSeek's
# telemetry collector, and the Session-log suffix on official DeepSeek API
# requests all stay unmounted.
- id: command-feedback
  disabled: true

- id: message-feedback
  disabled: true

- id: ui-message-feedback
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: session-log-deepseek
  disabled: true

# Web search runs Claude Code's own WebSearch with the same sign-in, so it needs
# no API key. Settings can select any other composed search provider instead.
- insert:
    - id: web-search-claude-code
      name: '@deepseek-ai/dsh-web-search-claude-code'

# The sidebar foot shows the Claude Code sign-in's five-hour and weekly plan usage.
- insert:
    - id: ui-claude-code-usage
      name: '@deepseek-ai/dsh-client-ui-claude-code-usage'

# The right Sidebar's Start page offers Source Control: commit, pull, and push
# without Git commands, plus GitHub sign-in, cloning, and publishing through
# the host's GitHub CLI.
- insert:
    - id: ui-git
      name: '@deepseek-ai/dsh-client-ui-git'

- id: web
  config:
    searchProvider: claude-code
    fetchProvider: http

# Browser tabs are on in every CCH profile, as on Desktop, so `cch web` and the
# Desktop app offer the same right-Sidebar pages.
- id: ui-sidebar-browser
  disabled: false
