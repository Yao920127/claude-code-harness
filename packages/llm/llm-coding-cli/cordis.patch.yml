# This optional Profile layer registers one model route per coding CLI. Each
# route runs that CLI's headless mode with the CLI's own sign-in and lists the
# models the CLI's own model picker offers. No CLI process starts until a
# model list is read or a model call runs; a CLI that is not installed lists
# only its CLI-settings entry.

- insert:
    - id: llm-codex
      name: '@deepseek-ai/dsh-llm-coding-cli'
      config:
        cli: codex
    - id: llm-antigravity
      name: '@deepseek-ai/dsh-llm-coding-cli'
      config:
        cli: antigravity
    - id: llm-grok
      name: '@deepseek-ai/dsh-llm-coding-cli'
      config:
        cli: grok
    - id: llm-opencode
      name: '@deepseek-ai/dsh-llm-coding-cli'
      config:
        cli: opencode

# App windows render each tool call a CLI reports as a tool card.
- insert:
    - id: ui-coding-cli-tools
      name: '@deepseek-ai/dsh-client-ui-coding-cli-tools'
